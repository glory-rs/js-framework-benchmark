[package]
name = "dioxus_benchmark"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["web","launch","macro","html","signals","hooks"] }
dioxus-web = { version = "=0.7.10", default-features = false }
js-sys = "=0.3.106"
wasm-bindgen = {version="=0.2.129",features=["enable-interning"]}
slab = "0.4.8"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
